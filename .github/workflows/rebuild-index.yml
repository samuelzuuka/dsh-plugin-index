name: Rebuild Plugin Index

on:
  # Manual trigger
  workflow_dispatch:
  # Daily rebuild to sync with upstream
  schedule:
    - cron: '0 0 * * *'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index
        run: node build-index.js

      - name: Commit and push if changed
        run: |
          git config user.name "z-imagine"
          git config user.email "z-imagine@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "No changes to index.json"
          else
            git commit -m "Rebuild plugin index"
            git push
          fi
